name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Dogfood - fixed example must be reproducible
        working-directory: examples/fixed-app
        run: node ../../bin/twinbuild.js -- npm run build
      - name: Dogfood - leaky example must be flagged
        working-directory: examples/leaky-app
        run: |
          set +e
          node ../../bin/twinbuild.js --brief -- npm run build
          test $? -eq 1
