<svg xmlns="http://www.w3.org/2000/svg" width="966" height="664" viewBox="0 0 966 664" role="img" aria-label="twinbuild finds why two identical builds differ">
<title>twinbuild finds why two identical builds differ</title>
<rect width="966" height="664" rx="10" fill="#0d1117"/>
<circle cx="22" cy="18" r="6" fill="#ff5f56"/><circle cx="42" cy="18" r="6" fill="#ffbd2e"/><circle cx="62" cy="18" r="6" fill="#27c93f"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14" fill="#c9d1d9">
<text x="24" y="52" xml:space="preserve"><tspan fill="#3fb950">$</tspan><tspan> </tspan><tspan font-weight="700">cd examples/leaky-app</tspan></text>
<text x="24" y="72" xml:space="preserve"><tspan fill="#3fb950">$</tspan><tspan> </tspan><tspan font-weight="700">npx twinbuild --brief -- npm run build</tspan></text>
<text x="24" y="92" xml:space="preserve"><tspan font-weight="700">twinbuild</tspan><tspan>  </tspan><tspan fill="#8b949e">npm run build</tspan></text>
<text x="24" y="112" xml:space="preserve"> </text>
<text x="24" y="132" xml:space="preserve"><tspan>  </tspan><tspan fill="#8b949e">build A</tspan><tspan>  </tspan><tspan fill="#3fb950">✓</tspan><tspan> 0.2s</tspan></text>
<text x="24" y="152" xml:space="preserve"><tspan>  </tspan><tspan fill="#8b949e">build B</tspan><tspan>  </tspan><tspan fill="#3fb950">✓</tspan><tspan> 0.2s  </tspan><tspan fill="#8b949e">different path, +1s clock, TZ=America/Los_Angeles</tspan></text>
<text x="24" y="172" xml:space="preserve"> </text>
<text x="24" y="192" xml:space="preserve"><tspan>  </tspan><tspan fill="#ff7b72" font-weight="700">✗ NOT REPRODUCIBLE</tspan><tspan>  </tspan><tspan font-weight="700">3</tspan><tspan> of 3 output files differ between two identical builds</tspan></text>
<text x="24" y="212" xml:space="preserve"> </text>
<text x="24" y="232" xml:space="preserve"><tspan>  </tspan><tspan fill="#8b949e">CAUSE                                       </tspan><tspan fill="#8b949e">FILES</tspan></text>
<text x="24" y="252" xml:space="preserve"><tspan>  Unordered output                              2</tspan></text>
<text x="24" y="272" xml:space="preserve"><tspan>  Content-hash in filename differs              1</tspan></text>
<text x="24" y="292" xml:space="preserve"><tspan>  Absolute build path embedded                  1</tspan></text>
<text x="24" y="312" xml:space="preserve"><tspan>  Build timestamp embedded                      1</tspan></text>
<text x="24" y="332" xml:space="preserve"><tspan>  Random or unstable identifier                 1</tspan></text>
<text x="24" y="352" xml:space="preserve"><tspan>  Archive entry order differs                   1</tspan></text>
<text x="24" y="372" xml:space="preserve"><tspan>  File mtimes stored in archive                 1</tspan></text>
<text x="24" y="392" xml:space="preserve"> </text>
<text x="24" y="412" xml:space="preserve"><tspan>  </tspan><tspan font-weight="700">dist/app.5ae44745c5.js ~ dist/app.58d2d39df3.js</tspan><tspan>  </tspan><tspan fill="#8b949e">hashed-filename, build-path, timestamp, random-id</tspan></text>
<text x="24" y="432" xml:space="preserve"><tspan>  </tspan><tspan font-weight="700">dist/manifest.json</tspan><tspan>  </tspan><tspan fill="#8b949e">ordering</tspan></text>
<text x="24" y="452" xml:space="preserve"><tspan>  </tspan><tspan font-weight="700">dist/release.tgz</tspan><tspan>  </tspan><tspan fill="#8b949e">archive-order, archive-mtime, ordering</tspan></text>
<text x="24" y="472" xml:space="preserve"> </text>
<text x="24" y="492" xml:space="preserve"><tspan fill="#3fb950">$</tspan><tspan> </tspan><tspan font-weight="700">cd ../fixed-app   # same project after fixing those causes</tspan></text>
<text x="24" y="512" xml:space="preserve"><tspan fill="#3fb950">$</tspan><tspan> </tspan><tspan font-weight="700">npx twinbuild --brief -- npm run build</tspan></text>
<text x="24" y="532" xml:space="preserve"><tspan font-weight="700">twinbuild</tspan><tspan>  </tspan><tspan fill="#8b949e">npm run build</tspan></text>
<text x="24" y="552" xml:space="preserve"> </text>
<text x="24" y="572" xml:space="preserve"><tspan>  </tspan><tspan fill="#8b949e">build A</tspan><tspan>  </tspan><tspan fill="#3fb950">✓</tspan><tspan> 0.1s</tspan></text>
<text x="24" y="592" xml:space="preserve"><tspan>  </tspan><tspan fill="#8b949e">build B</tspan><tspan>  </tspan><tspan fill="#3fb950">✓</tspan><tspan> 0.1s  </tspan><tspan fill="#8b949e">different path, +1s clock, TZ=America/Los_Angeles</tspan></text>
<text x="24" y="612" xml:space="preserve"> </text>
<text x="24" y="632" xml:space="preserve"><tspan>  </tspan><tspan fill="#3fb950" font-weight="700">✓ REPRODUCIBLE</tspan><tspan>  all 3 output files are byte-identical</tspan></text>
</g>
</svg>
