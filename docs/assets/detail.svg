<text x="24" y="492" xml:space="preserve"><tspan>    </tspan><tspan fill="#e3b341">•</tspan><tspan> Build timestamp embedded</tspan><tspan fill="#8b949e"> (dist/app.c1b253aca4.js line 1)</tspan></text>
<text x="24" y="512" xml:space="preserve"><tspan>        </tspan><tspan fill="#8b949e">A</tspan><tspan> </tspan><tspan fill="#79c0ff">/* leaky-app 1.0.0, built 2026-10-03T05:20:15.160Z in &lt;ROOT&gt; */⏎window.__BUILD_ID__ =…</tspan></text>
